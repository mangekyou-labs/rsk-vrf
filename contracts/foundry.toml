[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "paris"
optimizer = true
optimizer_runs = 50
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]
# The vectors are generated by tools/vrf-vectors-go and shared with the worker.
fs_permissions = [
    { access = "read", path = "../tools/vrf-vectors-go/vrf-proofs.json" },
    { access = "read", path = "../tools/vrf-vectors-go/coordinator-vectors.json" },
    { access = "read", path = "./test/fixtures/evmnet-rounds.json" },
    { access = "read", path = "../tools/bn254-svdw/vectors.json" },
]

[fmt]
ignore = ["src/vendor/**/*.sol"]

[lint]
ignore = ["src/vendor/**/*.sol"]
