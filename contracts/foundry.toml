[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
# The proof vectors are generated by tools/vrf-vectors-go and shared with the worker.
fs_permissions = [{ access = "read", path = "../tools/vrf-vectors-go/vrf-proofs.json" }]

[fmt]
ignore = ["src/vendor/**/*.sol"]

[lint]
ignore = ["src/vendor/**/*.sol"]
