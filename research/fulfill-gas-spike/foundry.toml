[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "paris"   # Rootstock: no PUSH0 / transient storage assumptions
optimizer = true
optimizer_runs = 200
ffi = true              # tests call scripts/prove.py for Chainlink VRF proofs over the on-chain Alpha
remappings = [
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[lint]
lint_on_build = false
