name: Worker image

# Builds the worker image on every PR that touches it, and pushes it to GHCR
# from main. Hosts run the digest printed in the job summary, never a tag.
on:
  pull_request:
    paths: [worker/**, .github/workflows/worker-image.yml]
  push:
    branches: [main]
    paths: [worker/**, .github/workflows/worker-image.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/rsk-vrf-worker
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: worker
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false
      - name: Record the digest to pin
        if: env.PUSH == 'true'
        run: |
          echo "Pin hosts to \`${IMAGE}@${{ steps.build.outputs.digest }}\` (Terraform variable \`worker_image\`, see infra/README.md)." >> "$GITHUB_STEP_SUMMARY"
