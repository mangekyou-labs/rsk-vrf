name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  vendor-pins:
    name: Vendored file pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the pin check
        run: contracts/script/test-vendor-pins.sh
      - name: Check vendored files against their pins and upstream
        run: contracts/script/check-vendor-pins.sh --upstream

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - name: Format
        run: forge fmt --check
      - name: Build
        run: forge build --sizes
      - name: Test upgrade safety gates
        run: python3 script/test-upgrade-safety.py --integration
      - name: Storage layout and runtime size gates
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git rev-parse --verify "${BASE_SHA}^{commit}" >/dev/null 2>&1; then
            echo "::error::Storage layout baseline commit is unavailable: $BASE_SHA"
            exit 1
          fi
          if git cat-file -e "$BASE_SHA:contracts/storage-layout/VRFCoordinator.json" 2>/dev/null; then
            python3 script/check-upgrade-safety.py --base-ref "$BASE_SHA"
          else
            echo "Bootstrapping storage snapshot: base revision predates the gate"
            python3 script/check-upgrade-safety.py
          fi
      - name: Test
        run: forge test -vvv

  vrf-vectors:
    name: VRF proof vectors
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/vrf-vectors-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/vrf-vectors-go/go.mod
          cache-dependency-path: tools/vrf-vectors-go/go.sum
      - name: Test
        run: go test ./...
      - name: Regenerate and fail on any diff
        run: |
          go run .
          git diff --exit-code -- vrf-proofs.json coordinator-vectors.json

  worker:
    name: Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  infra:
    name: Infra
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.7
      - name: Format
        run: terraform fmt -check -recursive
      - name: Validate
        run: terraform init -backend=false -input=false && terraform validate
      - name: Compose file
        run: |
          printf '%s\n' AWS_REGION=eu-central-1 LOG_GROUP=/rsk-vrf/primary RSK_NETWORK=testnet \
            SSM_CONFIG_PATH=/rsk-vrf/primary/ FULFILLER_KMS_KEY_ID=alias/rsk-vrf-primary-fulfiller \
            "WORKER_IMAGE=ghcr.io/mangekyou-labs/rsk-vrf-worker@sha256:$(printf '%064d' 0)" > "$RUNNER_TEMP/compose.env"
          docker compose -f compose/compose.yaml --env-file "$RUNNER_TEMP/compose.env" --profile import config --quiet

  worker-regtest:
    name: Worker on rskj regtest
    runs-on: ubuntu-latest
    services:
      rskj:
        image: rsksmart/rskj:VETIVER-9.0.4
        ports: [4444:4444]
        env:
          DEFAULT_JVM_OPTS: -Xms256m -Xmx1g
          RSKJ_OPTS: --regtest
          RSKJ_SYS_PROPS: >-
            -Drpc.providers.web.http.bind_address=0.0.0.0
            -Drpc.providers.web.http.hosts.0=localhost
            -Drpc.providers.web.http.hosts.1=127.0.0.1
            -Drpc.providers.web.http.hosts.2=::1
            -Dminer.client.enabled=false
            -Dminer.server.enabled=true
            -Dtransaction.accountTxRateLimit.enabled=false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/vrf-vectors-go/go.mod
          cache-dependency-path: tools/vrf-vectors-go/go.sum
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - name: Build contracts and offline signing relay
        run: |
          (cd contracts && forge build)
          (cd tools/vrf-vectors-go && go build -o "$RUNNER_TEMP/test-relay" .)
      - name: Install worker
        run: npm ci --prefix worker
      - name: Wait for real rskj RPC
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:4444 | jq -e '.result == "0x21"'; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Callback reserve boundaries, upgrade and worker lifecycle on rskj
        env:
          RSK_RPC_URL: http://127.0.0.1:4444
          TEST_RELAY_BIN: ${{ runner.temp }}/test-relay
        run: npm run test:integration --prefix worker
